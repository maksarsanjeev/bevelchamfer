<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фаска и скругление</title>
<style>
  /* Панель фаски на основе переданного интерфейса; светлая палитра B&A ниже.
     Зелёный несёт смысл и потому дозирован: число рёбер в выделении,
     активный режим, подсвеченное ребро на картинке, успех и главная
     кнопка. Всё остальное — оттенки графита. */
  :root{
    --bg:#212529;
    --card:#282D31;
    --card-line:rgba(255,255,255,.07);
    --field:#20252A;
    --field-line:rgba(255,255,255,.11);

    --text:#E9EBED;
    --muted:#9AA1A8;
    --dim:#6E767D;

    --mint:#3FE0A0;
    --mint-wash:rgba(63,224,160,.10);
    --mint-line:rgba(63,224,160,.42);
    --on-mint:#0C2419;

    --amber:#E2A860;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; overflow:hidden;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--text); font-size:13.5px; background:var(--bg);
  }
  svg{display:block; flex:none;}

  .app{display:flex; flex-direction:column; height:100vh; padding:18px 20px; gap:12px;}

  /* --- шапка ------------------------------------------------------------- */
  .head{display:flex; align-items:flex-start; gap:12px;}
  .head .mark{margin-top:2px;}
  .head h1{
    margin:0; font:600 17px/1.15 'Segoe UI',sans-serif;
    letter-spacing:.03em; text-transform:uppercase;
  }
  .head p{margin:3px 0 0; color:var(--muted); font-size:12.5px;}
  .head .grow{flex:1 1 auto; min-width:0;}
  .close{
    flex:none; width:26px; height:26px; padding:0; margin:0;
    background:none; border:0; border-radius:6px; color:var(--dim);
  }
  .close:hover{background:rgba(255,255,255,.07); color:var(--text);}

  /* --- карточки ---------------------------------------------------------- */
  .card{background:var(--card); border:1px solid var(--card-line); border-radius:12px; padding:14px 16px;}
  .card.pick{background:var(--mint-wash); border-color:var(--mint-line);}

  .pick{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .pick .n{display:flex; align-items:baseline; gap:9px; min-width:0;}
  .pick b{font:600 30px/1 'Segoe UI',sans-serif; color:var(--mint);}
  .pick span{color:var(--muted); font-size:14px;}

  /* --- поля -------------------------------------------------------------- */
  .body{display:flex; gap:14px; align-items:flex-start;}
  .fields{flex:1 1 auto; min-width:0;}

  .row{display:flex; align-items:center; gap:12px; margin-top:12px;}
  .row:first-child{margin-top:0;}
  .row label{flex:0 0 92px; color:var(--muted);}

  input[type=range]{
    flex:1 1 60px; min-width:60px; margin:0; height:4px;
    accent-color:var(--mint); cursor:pointer;
  }
  input[type=number]{
    width:70px; padding:8px 10px;
    background:var(--field); color:var(--text);
    border:1px solid var(--field-line); border-radius:8px;
    font:400 14px 'Segoe UI',sans-serif;
  }
  input[type=number]:focus{outline:none; border-color:var(--mint-line);}
  .unit{color:var(--dim);}

  /* Пределы слайдеров: мелкая строка, чтобы не спорила с основными полями. */
  .lim{gap:8px; margin-top:12px; color:var(--dim); font-size:12px;}
  .lim label{flex:0 0 92px; color:var(--dim); font-size:12px;}
  .lim input[type=number]{width:58px; padding:4px 7px; font-size:12px;}
  .lim .sub{margin-left:6px;}

  .live{display:flex; align-items:center; gap:7px; margin-top:12px; color:var(--muted); cursor:pointer; user-select:none;}
  .live input{margin:0; accent-color:var(--mint);}

  /* Переключатель режима: два прижатых сегмента, активный — изумрудный. */
  .seg{display:flex; border:1px solid var(--field-line); border-radius:8px; background:var(--field);}
  .seg button{
    margin:0; border:1px solid transparent; border-radius:7px;
    padding:7px 16px; background:transparent; color:var(--muted); font-size:13.5px;
  }
  .seg button:hover{color:var(--text);}
  .seg button.on{background:rgba(63,224,160,.13); border-color:var(--mint-line); color:var(--mint);}

  .hint{display:flex; align-items:flex-start; gap:8px; margin-top:14px; color:var(--dim); line-height:1.45;}
  .hint svg{margin-top:1px;}

  /* --- строка состояния -------------------------------------------------- */
  .note{display:flex; align-items:flex-start; gap:9px; min-height:38px; color:var(--muted); line-height:1.45;}
  .note svg{margin-top:2px;}
  .note.ok{color:var(--mint);}
  .note.warn{color:var(--amber);}

  /* --- кнопки ------------------------------------------------------------ */
  button{
    display:flex; align-items:center; justify-content:center; gap:9px;
    padding:11px 16px; cursor:pointer;
    background:var(--card); color:var(--text);
    border:1px solid var(--field-line); border-radius:10px;
    font:400 14px 'Segoe UI',sans-serif;
  }
  button:hover{background:#31373C;}

  .actions{display:flex; gap:10px; margin-top:auto;}
  .actions button{flex:1 1 auto;}
  .actions .primary{background:var(--mint); border-color:var(--mint); color:var(--on-mint); font-weight:600;}
  .actions .primary:hover{background:#54EBAE;}

  /* Палитра и плотность — дизайн-код B&A community (RALNCS / area-counter). */
  :root { --bg:#F5F5F4; --card:#fff; --card-line:#DDD; --field:#fff;
    --field-line:#BBB; --text:#1C1C1C; --muted:#555; --dim:#666;
    --mint:#2B6CB0; --mint-wash:#EBF2FA; --mint-line:#91B3D6;
    --on-mint:#fff; --amber:#935600; }
  body { overflow:auto; }
  .app { min-height:100vh; height:auto; gap:12px; }
  .card { border-radius:6px; }
  .actions { margin-top:auto; }
  button, input { font:inherit; }
  button { cursor:pointer; border-radius:5px; }
  button:hover { background:#F0F0EF; }
  .seg button.on { background:var(--mint-wash); }
  .close:hover { background:#ECECEA; }
  button:focus-visible, input:focus-visible { outline:2px solid #2B6CB0; outline-offset:3px; }
  .actions button.primary:hover { background:#245A94; }
  button:disabled { opacity:.45; cursor:default; }
  .modifier { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .modifier small { width:100%; color:var(--muted); line-height:1.45; }
  .note { min-height:56px; height:auto; flex-shrink:0; }
  .note.ok { color:#2F855A; }
  @media(max-width:480px) { .body > svg { width:70px; } .app { padding:14px; } }
</style>
</head>
<body>
<div class="app">

  <div class="head">
    <span class="mark">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <path d="M15 14.8 L26 9 v12 L15 26.8 Z" fill="rgba(255,255,255,.10)"/>
        <path d="M15 3.2 L26 9 v12 L15 26.8 L4 21 V9 Z" stroke="#2B6CB0" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M4 9 L15 14.8 L26 9" stroke="#2B6CB0" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M15 14.8 V26.8" stroke="#2B6CB0" stroke-width="1.6"/>
      </svg>
    </span>
    <div class="grow">
      <h1>Фаска и скругление</h1>
      <p>Создайте новые грани, скругляя или срезая рёбра</p>
    </div>
    <button class="close" id="close" title="Закрыть" aria-label="Закрыть">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3.5 3.5 l9 9 M12.5 3.5 l-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <div class="card pick">
    <div class="n"><b id="count">0</b> <span>рёбер в выделении</span></div>
    <button id="refresh">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M13.3 2.2 v3.1 h-3.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Обновить
    </button>
  </div>

  <div class="card body">
    <div class="fields">
      <div class="row">
        <label for="size">Размер</label>
        <input type="range" id="size-r" min="1" max="100" step="1" value="20" aria-label="Размер">
        <input type="number" id="size" min="0.1" step="1" value="20">
        <span class="unit" id="unit">мм</span>
      </div>
      <div class="row">
        <label>Считать как</label>
        <div class="seg">
          <button id="mode-offset" class="on">катет</button>
          <button id="mode-radius">радиус</button>
        </div>
      </div>
      <div class="row">
        <label for="segments">Сегментов</label>
        <input type="range" id="segments-r" min="1" max="24" step="1" value="8" aria-label="Сегментов">
        <input type="number" id="segments" min="1" max="200" step="1" value="8">
      </div>
      <div class="row lim">
        <label>Пределы</label>
        <span class="sub">размер</span><input type="number" id="size-max" min="1" step="1" value="100">
        <span class="sub">сегм.</span><input type="number" id="segments-max" min="2" max="200" step="1" value="24">
      </div>
      <label class="live"><input type="checkbox" id="live" checked> показывать во вьюпорте, пока кручу</label>
      <div class="hint">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/>
          <path d="M8 7.2 v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="8" cy="4.9" r=".85" fill="currentColor"/>
        </svg>
        <span id="hint"></span>
      </div>
    </div>

    <!-- Куб с уже срезанным передним ребром: изумрудом залита та самая новая
         грань, которую делает инструмент. Ближнее вертикальное ребро заменено
         полосой, верхняя грань из-за этого пятиугольная — ровно то, что
         происходит с геометрией на самом деле. -->
    <svg width="112" height="118" viewBox="0 0 120 124" fill="none" aria-hidden="true">
      <path d="M60 14 L104 39 L67.8 59.6 L52.2 59.6 L16 39 Z" fill="#8F979E"/>
      <path d="M16 39 L52.2 59.6 V105.6 L16 85 Z" fill="#5C646B"/>
      <path d="M104 39 L67.8 59.6 V105.6 L104 85 Z" fill="#464D53"/>
      <path d="M52.2 59.6 H67.8 V105.6 H52.2 Z" fill="#2B6CB0"/>
      <path d="M60 14 L104 39 L67.8 59.6 L52.2 59.6 L16 39 Z" stroke="rgba(255,255,255,.22)" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M16 39 V85 L52.2 105.6 M67.8 105.6 L104 85 V39" stroke="rgba(255,255,255,.14)" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M52.2 59.6 V105.6 H67.8 V59.6" stroke="#245A94" stroke-width="1.2" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="card modifier">
    <label><input type="checkbox" id="parametric" checked> Сохранить параметры</label>
    <button id="bake" disabled>Запечь</button>
    <small id="modifier-hint">Для группы или компонента: повторное выделение позволяет изменить фаску.</small>
  </div>
  <div class="note" id="note" role="status" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" id="note-icon" aria-hidden="true">
      <circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/>
      <path d="M8 7.2 v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="8" cy="4.9" r=".85" fill="currentColor"/>
    </svg>
    <span id="note-text">Выделите рёбра — или сразу группу целиком.</span>
  </div>

  <div class="actions">
    <button id="preview">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M1.4 9s2.8-5 7.6-5 7.6 5 7.6 5-2.8 5-7.6 5S1.4 9 1.4 9Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <circle cx="9" cy="9" r="2.1" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      Показать
    </button>
    <button id="apply" class="primary">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M3.4 9.4 L7 13 L14.6 5.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Применить
    </button>
  </div>
</div>

<script>
(function () {
  var app = {};
  var mode = 'offset';
  var timer = null;

  // Иконка строки состояния меняется вместе со смыслом сообщения.
  var ICON = {
    info: '<circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/>' +
          '<path d="M8 7.2 v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>' +
          '<circle cx="8" cy="4.9" r=".85" fill="currentColor"/>',
    ok:   '<circle cx="8" cy="8" r="7" fill="currentColor"/>' +
          '<path d="M4.8 8.2 L7 10.4 L11.3 5.9" stroke="#0C2419" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    warn: '<path d="M8 1.8 L15 14 H1 Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>' +
          '<path d="M8 6.2 v3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>' +
          '<circle cx="8" cy="11.8" r=".85" fill="currentColor"/>'
  };

  function $(id) { return document.getElementById(id); }
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (window.sketchup && sketchup[name]) { sketchup[name].apply(sketchup, args); }
  }

  // Пределы слайдеров и флажок живого превью помним между сеансами:
  // это привычки человека, а не свойство модели.
  function remember(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function recall(key, fallback) {
    try { var v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
  }

  function size()     { return parseFloat($('size').value); }
  function segments() { return parseInt($('segments').value, 10); }

  function hint() {
    var n = segments() || 1;
    $('hint').textContent = n <= 1
      ? 'Один сегмент — прямая фаска.'
      : n + ' сегментов — скругление; чем больше, тем глаже и тем тяжелее модель.';
  }

  function setMode(next) {
    mode = next;
    $('mode-offset').className = next === 'offset' ? 'on' : '';
    $('mode-radius').className = next === 'radius' ? 'on' : '';
    live();
  }

  function params(name) { clearTimeout(timer); call(name, size(), segments(), mode, $('parametric').checked); }

  // Живое превью: план считается на каждый тик, но SketchUp не надо
  // дёргать чаще, чем он успевает перерисоваться.
  function live() {
    if (!$('live').checked) { return; }
    clearTimeout(timer);
    timer = setTimeout(function () { params('live'); }, 40);
  }

  // Слайдер и число — одно значение в двух видах. Число может выйти за
  // предел слайдера: тогда слайдер упирается в край, а число остаётся.
  function applyLimits() {
    var sm = Math.max(1, parseFloat($('size-max').value) || 100);
    var gm = Math.min(200, Math.max(2, parseInt($('segments-max').value, 10) || 24));
    $('size-r').max = sm;
    $('segments-r').max = gm;
    remember('size-max', sm);
    remember('segments-max', gm);
    syncFromNumbers();
  }
  function syncFromNumbers() {
    $('size-r').value = size();
    $('segments-r').value = segments();
    hint();
  }
  function syncFromSliders() {
    $('size').value = $('size-r').value;
    $('segments').value = $('segments-r').value;
    hint();
  }

  app.state = function (data) {
    $('count').textContent = data.edges;
    $('unit').textContent = data.units;
    $('parametric').disabled = !data.object || !!data.modifier;
    $('bake').disabled = !data.modifier;
    if (data.modifier) {
      $('parametric').checked = true;
      $('size').value = (data.modifier.size * 25.4 * data.scale).toFixed(3);
      $('segments').value = data.modifier.segments;
      mode = data.modifier.mode;
      $('mode-offset').className = mode === 'offset' ? 'on' : '';
      $('mode-radius').className = mode === 'radius' ? 'on' : '';
      syncFromNumbers();
    }
    $('modifier-hint').textContent = data.modifier
      ? 'Параметрическая фаска. «Применить» пересчитает исходник; «Запечь» сохранит текущую геометрию.'
      : (data.object ? 'Исходник сохраняется в SKP. Для текстур и вложенных объектов снимите флажок.' : 'Для отдельных рёбер и граней применяется обычная фаска.');
  };

  app.say = function (text, kind) {
    var key = kind === 'ok' ? 'ok' : (kind === 'warn' ? 'warn' : 'info');
    $('note-text').textContent = text;
    $('note').className = 'note' + (key === 'info' ? '' : ' ' + key);
    $('note-icon').innerHTML = ICON[key];
  };

  $('bake').onclick = function () { clearTimeout(timer); call('bake'); };
  $('refresh').onclick = function () { call('refresh'); };
  $('preview').onclick = function () { params('preview'); };
  $('apply').onclick = function () { params('apply'); };
  $('close').onclick = function () { call('close'); };
  $('mode-offset').onclick = function () { setMode('offset'); };
  $('mode-radius').onclick = function () { setMode('radius'); };

  $('size-r').oninput = function () { syncFromSliders(); live(); };
  $('segments-r').oninput = function () { syncFromSliders(); live(); };
  $('size').oninput = function () { syncFromNumbers(); live(); };
  $('segments').oninput = function () { syncFromNumbers(); live(); };
  $('size-max').onchange = applyLimits;
  $('segments-max').onchange = applyLimits;
  $('live').onchange = function () {
    remember('live', $('live').checked ? '1' : '0');
    if ($('live').checked) { live(); } else { clearTimeout(timer); call('stop'); }
  };

  // Подобрал на глаз — Enter применяет из любого места окна, Esc убирает превью.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); params('apply'); }
    if (e.key === 'Escape') { clearTimeout(timer); call('stop'); }
  });

  $('size-max').value = recall('size-max', '100');
  $('segments-max').value = recall('segments-max', '24');
  $('live').checked = recall('live', '1') === '1';
  applyLimits();

  window.app = app;
  call('ready');
})();
</script>
</body>
</html>
