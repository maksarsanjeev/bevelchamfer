<html lang="ru">
<head>
<meta charset="utf-8">
<title>bevelchamfer</title>
<style>
:root { color-scheme:light; --bg:#F5F5F4; --text:#1C1C1C; --line:#BBB; --accent:#2B6CB0; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 "Segoe UI",system-ui,sans-serif; }
.app { padding:14px; display:grid; gap:14px; }
label { display:block; margin-bottom:7px; font-weight:600; }
.track { display:grid; grid-template-columns:64px minmax(80px,1fr) 76px; gap:12px; align-items:center; }
input,button { font:inherit; }
input[type=number] { width:100%; min-width:0; padding:7px 8px; border:1px solid var(--line); border-radius:5px; background:white; color:var(--text); }
input[type=range] { width:100%; margin:0; accent-color:var(--accent); cursor:pointer; }
button { border:1px solid var(--line); border-radius:5px; background:white; color:var(--text); padding:9px 12px; cursor:pointer; }
button:hover { background:#F0F0EF; }
button:focus-visible,input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
#preview[aria-pressed=true] { background:#EBF2FA; border-color:var(--accent); color:var(--accent); }
.primary { background:var(--accent); border-color:var(--accent); color:white; }
.primary:hover { background:#245A94; }
#note { margin:0; color:#935600; overflow-wrap:anywhere; }
[hidden] { display:none !important; }
.menu { position:fixed; z-index:5; min-width:210px; max-width:calc(100vw - 16px); padding:6px; border:1px solid #DDD; border-radius:6px; background:white; box-shadow:0 4px 15px #0002; }
.menu button { display:block; width:100%; padding:7px 9px; text-align:left; border:0; }
.menu button:disabled { color:#888; cursor:default; }
.menu .separator { border-top:1px solid #EEE; margin:4px 0; }
</style>
</head>
<body>
<main class="app" title="Правая кнопка мыши — режим размера и параметры фаски">
  <section>
    <label for="size-r">Размер, мм</label>
    <div class="track">
      <input id="size-min" type="number" min="0" step="0.1" value="0" aria-label="Левый предел размера" title="Левый предел размера. Ввод устанавливает точное значение.">
      <input id="size-r" type="range" min="0" max="100" step="0.1" value="20" aria-label="Размер фаски, мм">
      <input id="size" type="number" min="0" step="0.1" value="20" aria-label="Точный размер и правый предел" title="Точный размер. Введённое число задаёт правый предел слайдера.">
    </div>
  </section>
  <section>
    <label for="segments-r">Сегменты</label>
    <div class="track">
      <input id="segments-min" type="number" min="1" max="200" step="1" value="1" aria-label="Левый предел сегментов" title="Левый предел сегментов. Минимум 1 — прямая фаска.">
      <input id="segments-r" type="range" min="1" max="24" step="1" value="8" aria-label="Количество сегментов">
      <input id="segments" type="number" min="1" max="200" step="1" value="8" aria-label="Точное число сегментов и правый предел" title="Точное число сегментов. Введённое число задаёт правый предел слайдера.">
    </div>
  </section>
  <p id="note" role="status" aria-live="polite" hidden></p>
  <div class="actions">
    <button id="preview" aria-pressed="false">Показать</button>
    <button id="apply" class="primary">Применить</button>
  </div>
</main>
<!-- Дополнительные возможности доступны по правому клику; основная панель — только два слайдера и две кнопки. -->
<div id="menu" class="menu" role="menu" hidden>
  <button id="mode-offset" role="menuitemradio" aria-checked="true">✓ Размер как катет</button>
  <button id="mode-radius" role="menuitemradio" aria-checked="false">Размер как радиус</button>
  <div class="separator"></div>
  <button id="parametric" role="menuitemcheckbox" aria-checked="true">✓ Сохранить параметры</button>
  <button id="bake" role="menuitem" disabled>Запечь фаску</button>
</div>
<script>
(function () {
  var mode = 'offset', showing = false, timer = null, parametric = true;
  function $(id) { return document.getElementById(id); }
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (window.sketchup && sketchup[name]) sketchup[name].apply(sketchup, args);
  }
  function recall(key, fallback) {
    try { var value = localStorage.getItem(key); return value === null ? fallback : value; } catch(e) { return fallback; }
  }
  function remember(key, value) { try { localStorage.setItem(key, value); } catch(e) {} }
  function displayPreview(active) {
    showing = active; clearTimeout(timer);
    $('preview').setAttribute('aria-pressed', active ? 'true' : 'false');
    $('preview').textContent = active ? 'Скрыть' : 'Показать';
  }
  function params(name) {
    clearTimeout(timer);
    call(name, Number($('size').value), Number($('segments').value), mode, parametric);
  }
  function live() {
    if (!showing) return;
    clearTimeout(timer);
    timer = setTimeout(function () { params('live'); }, 60);
  }
  function settings() {
    ['offset', 'radius'].forEach(function (value) {
      $('mode-' + value).setAttribute('aria-checked', String(mode === value));
      $('mode-' + value).textContent = (mode === value ? '✓ ' : '') + 'Размер как ' + (value === 'offset' ? 'катет' : 'радиус');
    });
    $('parametric').setAttribute('aria-checked', String(parametric));
    $('parametric').textContent = (parametric ? '✓ ' : '') + 'Сохранить параметры';
  }
  function bindSlider(name, defaultMax, minimum, integer) {
    var range = $(name + '-r'), left = $(name + '-min'), right = $(name);
    function number(value) { return integer ? Math.round(value) : value; }
    var low = Math.max(minimum, Number(recall(name + '-min', minimum)) || minimum);
    if (integer) low = Math.min(199, number(low));
    var high = Math.max(low + (integer ? 1 : 0.1), Number(recall(name + '-max', defaultMax)) || defaultMax);
    if (integer) high = Math.min(200, number(high));
    range.min = left.value = low; range.max = high;
    range.value = Math.min(high, Math.max(low, Number(right.value)));
    right.value = range.value;
    range.oninput = function () { right.value = range.value; $('note').hidden = true; live(); };
    left.onchange = function () {
      var value = number(Number(left.value));
      if (!Number.isFinite(value) || value < minimum || value >= Number(range.max)) {
        left.value = range.min; return;
      }
      range.min = value; range.value = value; right.value = value;
      remember(name + '-min', value); live();
    };
    right.oninput = function () {
      if (right.value === '') return;
      var value = Number(right.value);
      if (!Number.isFinite(value) || value < minimum || (integer && (value > 200 || value !== Math.round(value)))) return;
      if (value > Number(range.max)) range.max = value;
      if (value < Number(range.min)) { range.min = value; left.value = value; remember(name + '-min', value); }
      range.value = value; live();
    };
    right.onchange = function () {
      var value = number(Number(right.value));
      if (right.value === '' || !Number.isFinite(value) || value < minimum || (integer && value > 200)) {
        right.value = range.value; return;
      }
      if (value <= Number(range.min)) {
        range.min = minimum; left.value = minimum; remember(name + '-min', minimum);
      }
      range.max = Math.max(value, Number(range.min) + (integer ? 1 : 0.1));
      range.value = value; right.value = value;
      remember(name + '-max', range.max); live();
    };
  }
  bindSlider('size', 100, 0, false);
  bindSlider('segments', 24, 1, true);
  window.app = {
    preview: displayPreview,
    state: function (data) {
      $('parametric').disabled = !data.object || !!data.modifier;
      $('bake').disabled = !data.modifier;
      if (data.modifier) {
        parametric = true; mode = data.modifier.mode;
        $('size').value = Number((data.modifier.size * 25.4 * data.scale).toFixed(3));
        $('segments').value = data.modifier.segments;
        ['size', 'segments'].forEach(function (name) {
          var range = $(name + '-r'), value = Number($(name).value);
          range.max = Math.max(Number(range.max), value);
          if (value < Number(range.min)) { range.min = name === 'size' ? 0 : 1; $(name + '-min').value = range.min; }
          range.value = value;
        });
      }
      settings();
    },
    say: function (text, kind) {
      // Обычные отчёты убраны; ошибки остаются доступными.
      $('note').textContent = text; $('note').hidden = kind !== 'warn';
    }
  };
  $('preview').onclick = function () {
    displayPreview(!showing);
    if (showing) params('preview'); else call('stop');
  };
  $('apply').onclick = function () { displayPreview(false); params('apply'); };
  $('mode-offset').onclick = function () { mode = 'offset'; settings(); $('menu').hidden = true; live(); };
  $('mode-radius').onclick = function () { mode = 'radius'; settings(); $('menu').hidden = true; live(); };
  $('parametric').onclick = function () { parametric = !parametric; settings(); $('menu').hidden = true; };
  $('bake').onclick = function () { displayPreview(false); call('bake'); $('menu').hidden = true; };
  function openMenu(x, y) {
    var menu = $('menu'); menu.hidden = false;
    menu.style.left = Math.max(4, Math.min(x, innerWidth - menu.offsetWidth - 4)) + 'px';
    menu.style.top = Math.max(4, Math.min(y, innerHeight - menu.offsetHeight - 4)) + 'px';
    $('mode-offset').focus();
  }
  document.querySelector('main').addEventListener('contextmenu', function (e) { e.preventDefault(); openMenu(e.clientX, e.clientY); });
  document.addEventListener('click', function (e) { if (!$('menu').contains(e.target)) $('menu').hidden = true; });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && $('menu').hidden) { e.preventDefault(); document.activeElement.blur(); displayPreview(false); params('apply'); }
    if (e.key === 'Escape') { displayPreview(false); call('stop'); $('menu').hidden = true; }
    if (e.key === 'F10' && e.shiftKey) { e.preventDefault(); openMenu(14,14); }
  });
  window.addEventListener('focus', function () { call('refresh'); });
  settings(); call('ready');
})();
</script>
</body>
</html>
